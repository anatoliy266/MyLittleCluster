services:
  namenode-format:
    image: apache/hadoop:3.5.0
    container_name: namenode-format
    user: root
    profiles:
      - init
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["hdfs", "namenode", "-format"]
    networks:
      - hadoop

  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["hdfs", "namenode"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hadoop

  datanode:
    image: apache/hadoop:3.5.0
    container_name: datanode
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - hadoop

  resourcemanager:
    image: apache/hadoop:3.5.0
    container_name: resourcemanager
    ports:
      - "8088:8088"
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
      - datanode
    networks:
      - hadoop

  nodemanager:
    image: apache/hadoop:3.5.0
    container_name: nodemanager
    ports:
      - "8042:8042"
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  nodemanager2:
    image: apache/hadoop:3.5.0
    container_name: nodemanager2
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  nodemanager3:
    image: apache/hadoop:3.5.0
    container_name: nodemanager3
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  historyserver:
    image: apache/hadoop:3.5.0
    container_name: historyserver
    ports:
      - "19888:19888"
    
    volumes:
      - history_data:/hadoop/yarn/timeline
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["mapred", "historyserver"]
    depends_on:
      - namenode
      - datanode
    networks:
      - hadoop

  spark:
    image: apache/spark:4.2.0-preview5-scala2.13-java17-python3-ubuntu
    container_name: spark
    stdin_open: true
    tty: true
    environment:
      - HADOOP_CONF_DIR=/etc/hadoop
    ports:
      - "4040:4040"
    volumes:
      - ./apps:/apps
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
      - ./spark_conf:/spark/conf:ro
      - spark_bin:/opt/spark
      - java_bin:/opt/java/openjdk
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - namenode
      - datanode
      - resourcemanager
    networks:
      - hadoop

  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - ./airflow/airflow.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hadoop
  # 1. Инициализация БД (Airflow 3.x)
  airflow-init:
    build:
      context: ./airflow
    container_name: airflow-init
    env_file:
      - ./airflow/airflow.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Включаем менеджер авторизации FAB для Airflow 3, чтобы команда создания пользователя работала
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      airflow users create --username \$${AIRFLOW_ADMIN_USER} --firstname Admin --lastname User --role Admin --email \$${AIRFLOW_ADMIN_EMAIL} --password \$${AIRFLOW_ADMIN_PASSWORD} &&
      echo 'Airflow initialized with your custom FAB RBAC variables'
      "
    networks:
      - hadoop

  airflow-api-server:
    build:
      context: ./airflow
    container_name: airflow-api-server
    env_file:
      - ./airflow/airflow.env
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Обязательно дублируем менеджер авторизации здесь
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__BASE_URL: http://localhost:8080
    ports:
      - "8080:8080" # Внешний порт строго на внутренний 8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ./apps:/apps
      - ./logs:/opt/airflow/logs
      - ./hadoop_conf:/etc/hadoop:ro
      - spark_bin:/opt/spark:ro
      - java_bin:/opt/java/openjdk:ro
    command: airflow api-server --host 0.0.0.0
    networks:
      - hadoop

  airflow-dag-processor:
    build:
      context: ./airflow
    container_name: airflow-dag-processor
    env_file:
      - ./airflow/airflow.env
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__BASE_URL: http://airflow-api-server:8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ./apps:/apps
      - ./logs:/opt/airflow/logs
      - ./hadoop_conf:/etc/hadoop:ro
      - spark_bin:/opt/spark:ro
      - java_bin:/opt/java/openjdk:ro
    command: airflow dag-processor
    networks:
      - hadoop

  airflow-scheduler:
    build:
      context: ./airflow
    container_name: airflow-scheduler
    env_file:
      - ./airflow/airflow.env
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__BASE_URL: http://airflow-api-server:8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ./apps:/apps
      - ./logs:/opt/airflow/logs
      - ./hadoop_conf:/etc/hadoop:ro
      - spark_bin:/opt/spark:ro
      - java_bin:/opt/java/openjdk:ro
    command: airflow scheduler
    networks:
      - hadoop

volumes:
  namenode_data:
  datanode_data:
  history_data:
  postgres_data:
  spark_bin:
  java_bin:

networks:
  hadoop:
    name: hadoop-cluster
    driver: bridge
