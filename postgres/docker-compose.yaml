# Стек PostgreSQL (metadata-БД Airflow).
# Требует предварительно созданной сети: docker compose -f infra/compose.yaml up -d
# Запуск с ожиданием готовности (Airflow-стеку нужен именно здоровый postgres):
#   docker compose -f postgres/compose.yaml up -d --wait

name: postgres

services:
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=test
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_conf/postgresql.conf:/etc/postgresql.conf:ro
      - ./postgres_conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres_conf/initdb:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cluster

volumes:
  postgres_data:

networks:
  cluster:
    external: true
