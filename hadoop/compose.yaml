# Стек HDFS + YARN.
# Требует предварительно созданной сети: docker compose -f infra/compose.yaml up -d
# Первая инициализация: docker compose -f hadoop/compose.yaml --profile init up -d

name: hadoop

services:
  namenode-format:
    image: apache/hadoop:3.5.0
    container_name: namenode-format
    user: root
    profiles:
      - init
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["hdfs", "namenode", "-format"]
    networks:
      - cluster

  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["hdfs", "namenode"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cluster

  datanode:
    image: apache/hadoop:3.5.0
    container_name: datanode
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - cluster

  resourcemanager:
    image: apache/hadoop:3.5.0
    container_name: resourcemanager
    ports:
      - "8088:8088"
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
      - datanode
    networks:
      - cluster

  nodemanager:
    image: apache/hadoop:3.5.0
    container_name: nodemanager
    ports:
      - "8042:8042"
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - cluster

  nodemanager2:
    image: apache/hadoop:3.5.0
    container_name: nodemanager2
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - cluster

  nodemanager3:
    image: apache/hadoop:3.5.0
    container_name: nodemanager3
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - cluster

  historyserver:
    image: apache/hadoop:3.5.0
    container_name: historyserver
    ports:
      - "19888:19888"
    volumes:
      - history_data:/hadoop/yarn/timeline
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
    command: ["mapred", "historyserver"]
    depends_on:
      - namenode
      - datanode
    networks:
      - cluster

volumes:
  namenode_data:
  datanode_data:
  history_data:

networks:
  cluster:
    external: true
