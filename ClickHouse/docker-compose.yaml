services:
  namenode-format:
    image: clickhouse:26.7.3.19
    container_name: clickhouse-server
    user: root
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./hadoop_conf:/opt/hadoop/etc/hadoop:ro
      - spark_bin:/opt/spark:ro
      - java_bin:/opt/java/openjdk:ro
    command: []
    networks:
      - hadoop
      - kafka_kafka-net

volumes:
  spark_bin:
  java_bin:

networks:
  hadoop:
    name: hadoop-cluster
    driver: bridge
  kafka_kafka-net:
    external: true