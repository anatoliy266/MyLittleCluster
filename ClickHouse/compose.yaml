# Стек ClickHouse.
# Требует предварительно созданной сети: docker compose -f infra/compose.yaml up -d
# host-порт 9000 (native) сдвинут на 19000, чтобы не конфликтовать
# с HDFS RPC namenode (localhost:9000).

name: clickhouse

services:
  clickhouse-server:
    image: clickhouse/clickhouse-server:26.7.3.19
    container_name: clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cluster

volumes:
  clickhouse_data:
  clickhouse_logs:

networks:
  cluster:
    external: true
