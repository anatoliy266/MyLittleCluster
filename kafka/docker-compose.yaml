name: kafka

x-configs: &kafka-base
  image: apache/kafka:4.3.0
  env_file:
    - ./kafka.env
  networks:
    - kafka-net

services:
  controller-1:
    container_name: controller-1
    <<: *kafka-base
    volumes:
      - ./kafka_conf/c1:/mnt/shared/config
      - c1-data:/var/lib/kafka/data

  controller-2:
    container_name: controller-2
    <<: *kafka-base
    volumes:
      - ./kafka_conf/c2:/mnt/shared/config
      - c2-data:/var/lib/kafka/data

  controller-3:
    container_name: controller-3
    <<: *kafka-base
    volumes:
      - ./kafka_conf/c3:/mnt/shared/config
      - c3-data:/var/lib/kafka/data

  broker-1:
    container_name: broker-1
    <<: *kafka-base
    ports:
      - 29092:29092
    volumes:
      - ./kafka_conf/b1:/mnt/shared/config
      - b1-data:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - kafka-net
      - cluster


  broker-2:
    container_name: broker-2
    <<: *kafka-base
    ports:
      - 39092:39092
    volumes:
      - ./kafka_conf/b2:/mnt/shared/config
      - b2-data:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - kafka-net
      - cluster

  broker-3:
    container_name: broker-3
    <<: *kafka-base
    ports:
      - 49092:49092
    volumes:
      - ./kafka_conf/b3:/mnt/shared/config
      - b3-data:/var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - kafka-net
      - cluster

volumes:
  c1-data:
  c2-data:
  c3-data:
  b1-data:
  b2-data:
  b3-data:

networks:
  # Обе сети создаются отдельным файлом infra/compose.yaml
  kafka-net:
    external: true
  cluster:
    external: true
