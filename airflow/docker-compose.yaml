# Стек Airflow (api-server, dag-processor, scheduler + init).
# Файл лежит внутри airflow/: dags, logs, apps, airflow.env, Dockerfile — рядом.
# Требует предварительно созданной сети: docker compose -f infra/compose.yaml up -d
# Порядок старта:
#   1. docker compose -f postgres/compose.yaml up -d --wait   (postgres здоров)
#   2. docker compose -f airflow/compose.yaml up -d --build   (airflow-init отработает первым)
# Пересоздание только этого стека не затрагивает остальные:
#   docker compose -f airflow/compose.yaml up -d --force-recreate

name: airflow

x-configs: &airflow-base
  build:
    context: .
  env_file:
      - ./airflow.env
  volumes:
    - ./airflow_conf/airflow.cfg:/opt/airflow/airflow.cfg:ro
    - ./dags:/opt/airflow/dags
    - ./apps:/apps
    - ./logs:/opt/airflow/logs
  networks:
    - cluster

services:

  airflow-init:
    container_name: airflow-init
    <<: *airflow-base
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "=== Airflow init started ==="
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" || echo "User already exists"
        echo "=== Airflow init completed ==="
    networks:
      - cluster
  airflow-api-server:
    container_name: airflow-api-server
    <<: *airflow-base
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: airflow api-server --host 0.0.0.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - cluster

  airflow-dag-processor:
    container_name: airflow-dag-processor
    <<: *airflow-base
    restart: unless-stopped
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - cluster

  airflow-scheduler:
    container_name: airflow-scheduler
    <<: *airflow-base
    restart: unless-stopped
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - cluster

networks:
  cluster:
    external: true
